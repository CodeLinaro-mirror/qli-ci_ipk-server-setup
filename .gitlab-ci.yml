default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5
  tags:
    - amd64-runner

variables:
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build:
  stage: build
  before_script:
    - apk add --update curl && apk add --update git tar unzip zip && rm -rf /var/cache/apk/*
    - dockerd -l fatal &
    # - docker login -u "$ART_DOCKER_USER" -p "$ART_DOCKER_PASS" $ART_DOCKER_REG
    # Installing JFrog CLI
    - curl -fL https://install-cli.jfrog.io | sh
    - chmod +x /usr/local/bin/jf
    # Configure artifactory instance with JFrog CLI
    - pwd
    - projFolder=$(pwd)
    # - cd /usr/local/bin/
    - /usr/local/bin/jf --version
    - /usr/local/bin/jf c add artifactory-server --url=$ART_PLAT_URL --user=$ART_PLAT_USER --password=$ART_PLAT_PASS
    - /usr/local/bin/jf rt ping

  script:
    # Variables
    - QCOM_RELEASE=qli-2.0-rc1
    - DOCKER_TAG="qli-2.0-rc1_22.04"
    - URL="https://github.com/qualcomm-linux"
    - BRANCH="qli-2.0-rc1"
    - PROJECT="meta-qcom-releases"
    - MACHINE="rb3gen2-core-kit"
    - ARCH="x86"
    - DISTRO="qcom-distro-prop-image"
    - IMAGE="qcom-multimedia-image"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"

    # Docker Build & Run
    - docker build --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - docker run --name build ${DOCKER_TAG} -u ${URL} -b ${BRANCH} -p ${PROJECT} -M ${MACHINE} -d ${DISTRO} -i ${IMAGE} -w "${WORK_DIR}/${DOCKER_TAG}" -a ${ARCH}

    # Define a reusable function for artifacts copy & zip it and upload to artifactory
    # This reduces code duplication and improves maintainability

    - |
      echo "Setting up artifacts copy, zip and upload function..."
      create_artifact_zipit_and_upload(){
        #set -euo pipefail
        local machine_name=$1
        
        #****************
        mkdir -p /rpm
        mkdir -p /images/${machine_name}
        mkdir -p /images/backup/${machine_name}
        #******************
        
             
        #************
        docker cp -L build:${WORK_DIR}/qli-2.0-rc1_22.04/build/tmp/deploy/images/${machine_name}/. /images/backup/${machine_name}/
        #************
        
        docker cp build:${WORK_DIR}/qcom-6.18-qli.2.0-ver.1.0_22.04/NOTICE /images/${machine_name}/
        docker cp build:${WORK_DIR}/qcom-6.18-qli.2.0-ver.1.0_22.04/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/
        
        #*****************
        real_path=$(readlink "/images/backup/${machine_name}/qcom-multimedia-image-${machine_name}.rootfs.qcomflash.tar.gz")
        cp /images/backup/${machine_name}/${real_path} /images/${machine_name}/
        tar -xzvf /images/${machine_name}/${real_path} -C /images/${machine_name}
        rm -f /images/${machine_name}/${real_path}
        real_path=$(readlink "/images/backup/${machine_name}/qcom-multimedia-proprietary-image-${machine_name}.rootfs.qcomflash.tar.gz")
        cp /images/backup/${machine_name}/${real_path} /images/${machine_name}/
        tar -xzvf /images/${machine_name}/${real_path} -C /images/${machine_name}
        rm -f /images/${machine_name}/${real_path}
        rm -rf /images/backup/${machine_name}
        #******************

        #*******************
        zip -r qcom-qli-2.0-rc1-qcom-multimedia-image.zip /images/${machine_name}/NOTICE /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/qcom-multimedia-image-${machine_name}
        zip -r qcom-qli-2.0-rc1-qcom-multimedia-proprietary-image.zip /images/${machine_name}/NOTICE /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/qcom-multimedia-proprietary-image-${machine_name}
        #********************
        /usr/local/bin/jf rt ping
        /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive "qcom-qli-2.0-rc1-*.zip" qli-ci/flashable-binaries/meta-qcom/${machine_name}/
        rm -f qcom-qli-2.0-rc1-*.zip
      }
    - |
      echo "Setting up artifacts and sdk copy, zip and upload function..."
      create_artifact_and_sdk_zipit_and_upload(){
        #set -euo pipefail
        local machine_name=$1
        #****************
        mkdir -p /rpm
        mkdir -p /images/${machine_name}
        mkdir -p /images/backup/${machine_name}
        #******************
        mkdir -p /images/${machine_name}/sdk
               
        #************
        docker cp -L build:${WORK_DIR}/qli-2.0-rc1_22.04/build/tmp/deploy/images/${machine_name}/. /images/backup/${machine_name}/
        #************
        
        docker cp build:${WORK_DIR}/qli-2.0-rc1_22.04/build/tmp/deploy/sdk/. /images/${machine_name}/sdk/
        docker cp build:${WORK_DIR}/qcom-6.18-qli.2.0-ver.1.0_22.04/NOTICE /images/${machine_name}/
        docker cp build:${WORK_DIR}/qcom-6.18-qli.2.0-ver.1.0_22.04/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/
        
        #*****************
        real_path=$(readlink "/images/backup/${machine_name}/qcom-multimedia-image-${machine_name}.rootfs.qcomflash.tar.gz")
        cp /images/backup/${machine_name}/${real_path} /images/${machine_name}/
        tar -xzvf /images/${machine_name}/${real_path} -C /images/${machine_name}
        rm -f /images/${machine_name}/${real_path}
        real_path=$(readlink "/images/backup/${machine_name}/qcom-multimedia-proprietary-image-${machine_name}.rootfs.qcomflash.tar.gz")
        cp /images/backup/${machine_name}/${real_path} /images/${machine_name}/
        tar -xzvf /images/${machine_name}/${real_path} -C /images/${machine_name}
        rm -f /images/${machine_name}/${real_path}
        rm -rf /images/backup/${machine_name}
        #******************

        #*******************
        zip -r qcom-qli-2.0-rc1-qcom-multimedia-image.zip /images/${machine_name}/NOTICE /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/qcom-multimedia-image-${machine_name}
        zip -r qcom-qli-2.0-rc1-qcom-multimedia-proprietary-image.zip /images/${machine_name}/NOTICE /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf /images/${machine_name}/qcom-multimedia-proprietary-image-${machine_name}
        #********************
        
        zip -r x86-qcom-qli-2.0-rc1-esdk.zip /images/${machine_name} /images/${machine_name}/sdk -i /images/${machine_name}/sdk/*-toolchain-ext-*.sh -i /images/${machine_name}/NOTICE -i /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf
        zip -r x86-qcom-qli-2.0-rc1-standardsdk.zip /images/${machine_name} /images/${machine_name}/sdk -i /images/${machine_name}/sdk/*-toolchain-*.sh -x /images/${machine_name}/sdk/*-toolchain-ext-*.sh -i /images/${machine_name}/NOTICE -i /images/${machine_name}/NO.LOGIN.BINARY.LICENSE.QTI.pdf
        
        /usr/local/bin/jf rt ping
        /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive "qcom-qli-2.0-rc1-*.zip" qli-ci/flashable-binaries/meta-qcom/${machine_name}/
        rm -f qcom-qli-2.0-rc1-*.zip
        /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive "x86-qcom-qli-2.0-rc1-*.zip" qli-ci/flashable-binaries/meta-qcom/${machine_name}/
        rm -f x86-qcom-qli-2.0-rc1-*.zip
      }    
    - echo "Processing Copy, zip and upload for different machines"

    #*********************
    - create_artifact_zipit_and_upload "rb3gen2-core-kit"
    - create_artifact_zipit_and_upload "iq-8275-evk"
    - create_artifact_zipit_and_upload "iq-9075-evk"
    - create_artifact_zipit_and_upload "iq-615-evk"
    #**********************
    
    # - create_artifact_zipit_and_upload "qcs615-ride"
    # - create_artifact_zipit_and_upload "iq-x7181-evk"
    - create_artifact_and_sdk_zipit_and_upload "qcom-armv8a"

    #********************
    - docker cp build:${WORK_DIR}/qcom-6.18-qli.2.0-ver.1.0_22.04/build/tmp/deploy/rpm/. /rpm
    - /usr/local/bin/jf rt ping
    - /usr/local/bin/jf rt u --detailed-summary --flat=false --include-dirs --recursive "/rpm/(**)" "qli-yocto-rpm/${QCOM_RELEASE}/rpm/{1}"
    #*********************
    - docker rm build