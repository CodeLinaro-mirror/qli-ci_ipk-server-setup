default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5
  tags:
    - arm64-runner

variables:
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build:
  stage: build

  before_script:
    - apk add --update curl && apk add --update git unzip zip && rm -rf /var/cache/apk/*
    - dockerd -l fatal &
    # - docker login -u "$ART_DOCKER_USER" -p "$ART_DOCKER_PASS" $ART_DOCKER_REG
    # Installing JFrog CLI
    - curl -fL https://install-cli.jfrog.io | sh
    - chmod +x /usr/local/bin/jf
    # Configure Artifactory instance with JFrog CLI
    - pwd
    - projFolder=$(pwd)
    # - cd /usr/local/bin/
    - /usr/local/bin/jf --version
    - /usr/local/bin/jf c add artifactory-server --url=$ART_PLAT_URL --user=$ART_PLAT_USER --password=$ART_PLAT_PASS
    - /usr/local/bin/jf rt ping


  script:
    # Variables
    - QCOM_RELEASE=qli-2.0
    - DOCKER_TAG="qli-2.0_20.04"
    - URL="https://github.com/qualcomm-linux/qcom-manifest"
    - BRANCH="qcom-linux-scarthgap"
    - MANIFEST_FILE="${QCOM_RELEASE}.xml"
    - MACHINE="qcs6490-rb3gen2-vision-kit"
    - ARCH="x86"
    - DISTRO="qcom-wayland"
    - IMAGE="qcom-multimedia-image"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"

    # Docker Build & Run
    - docker build --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - wget https://artifacts.codelinaro.org/artifactory/qli-ci/flashable-binaries/meta-qcom-robotics/qcom-robotics-distro/iq-8275-evk/qli-2.0-robotics-sdk-artifacts.zip
    - unzip qli-2.0-robotics-sdk-artifacts.zip
    - rm -rf qli-2.0-robotics-sdk-artifacts.zip
    - zip -r x86-qli-2.0-robotics-sdk-artifacts.zip images
    - /usr/local/bin/jf rt ping
    - /usr/local/bin/jf rt u --detailed-summary --flat=false --recursive x86-qli-2.0-robotics-sdk-artifacts.zip qli-ci/flashable-binaries/meta-qcom-robotics/qcom-robotics-distro/iq-8275-evk