default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5

# Global variables for the pipeline
variables:
  RELEASE_TAG: "qli-2.1"
  # Kubernetes resource requests
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 256G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 700G

build-arm64:
  stage: build
  tags:
    - arm64-runner
  parallel:
    matrix:
      - TARGET: iq-9075-evk
      - TARGET: iq-8275-evk
        KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 600G
  script:
    - DOCKER_TAG="robotics-builder"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"
    - docker build --network=host --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - docker run --name build --network=host ${DOCKER_TAG} -g ${RELEASE_TAG} -t ${TARGET} -w ${WORK_DIR}/${DOCKER_TAG} -u $ART_PLAT_USER -a $ART_PLAT_PASS -r $ART_PLAT_URL --arch arm --upload-images --upload-sdk --upload-rpm
    - docker rm build

build-x86:
  stage: build
  tags:
    - amd64-runner
  parallel:
    matrix:
      - TARGET: iq-9075-evk
      - TARGET: iq-8275-evk
        KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 600G
  script:
    - DOCKER_TAG="robotics-builder"
    - USER=lnxbuild
    - UID=2366345
    - GID=2366345
    - WORK_DIR="/home/${USER}/app"
    - docker build --network=host --build-arg USER=${USER} --build-arg UID=${UID} --build-arg GID=${GID} --no-cache -t ${DOCKER_TAG} .
    - docker run --name build --network=host ${DOCKER_TAG} -g ${RELEASE_TAG} -t ${TARGET} -w ${WORK_DIR}/${DOCKER_TAG} -u $ART_PLAT_USER -a $ART_PLAT_PASS -r $ART_PLAT_URL --arch x86 --upload-sdk
    - docker rm build
