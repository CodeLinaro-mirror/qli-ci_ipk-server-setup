default:
  image: docker:25.0.3-dind
  before_script:
    - dockerd -l fatal &
    - sleep 5

variables:
  TAG: qli-2.0
  KUBERNETES_CPU_REQUEST: 60
  KUBERNETES_MEMORY_REQUEST: 128G
  KUBERNETES_EPHEMERAL_STORAGE_REQUEST: 500G

build-x86:
  stage: build
  tags:
    - amd64-runner
  parallel:
    matrix:
      - MACHINE: rb3gen2-core-kit
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: iq-9075-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: iq-8275-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: iq-615-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: iq-x7181-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: iq-x5121-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: shikra-evk
        DISTRO: qcom-distro qcom-distro-sota
      - MACHINE: qcom-armv8a
        DISTRO: qcom-distro qcom-distro-sota
  script:
    - ARCH="x86"
    - docker build -t clo-release-worker .
    - docker run clo-release-worker --tag ${TAG} --machine ${MACHINE} --distro ${DISTRO} --arch ${ARCH}

build-arm64:
  stage: build
  tags:
    - arm64-runner
  parallel:
    matrix:
      - MACHINE: qcom-armv8a
        DISTRO: qcom-distro
      - MACHINE: qcom-armv8a
        DISTRO: qcom-distro-sota
  script:
    - ARCH="arm"
    - docker build -t clo-release-worker .
    - docker run clo-release-worker --tag ${TAG} --machine ${MACHINE} --distro ${DISTRO} --arch ${ARCH}
